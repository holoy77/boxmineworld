name: BoxMineWorld AFK Earn

on:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）运行一次
    - cron: '0 1 * * *'
  workflow_dispatch: # 保留手动触发按钮

jobs:
  earn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run BoxMineWorld AFK earn
        run: |
          python earn_boxmineworld.py

      - name: Save BoxMineWorld state
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add boxmineworld_state.json || true
          git commit -m "chore: update session state [skip ci]" || true
          git push || true
